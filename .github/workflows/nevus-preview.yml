name: Nevus Preview APK

on:
  push:
    branches:
      - nevus-preview-build-20260821
    paths:
      - 'nevus-preview/**'
      - '.github/workflows/nevus-preview.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platform-tools"

      - name: Build debug APK
        working-directory: nevus-preview
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="nevus-preview/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee nevus-preview/NevusBrowser-Preview02.apk.sha256
          cp "$APK" nevus-preview/NevusBrowser-Preview02.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NevusBrowser-Preview02
          path: |
            nevus-preview/NevusBrowser-Preview02.apk
            nevus-preview/NevusBrowser-Preview02.apk.sha256
          if-no-files-found: error
          retention-days: 14
